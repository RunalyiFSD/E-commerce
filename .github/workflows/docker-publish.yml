name: Docker Build & Push

# Triggers on every push to main or dev
on:
  push:
    branches:
      - main
      - dev

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and push the Backend Docker image
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for multi-platform builds (optional, good practice)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for advanced build features and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub using secrets stored in GitHub repository settings
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the backend image and push to Docker Hub
      # Tags the image as both :latest and :<git-sha> for traceability
      - name: Build & Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/emart-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/emart-backend:${{ github.sha }}
          # Cache layers from the previous build to speed things up
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/emart-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/emart-backend:buildcache,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build and push the Frontend Docker image
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the frontend image (multi-stage: Vite build → Nginx serve)
      # Tags the image as both :latest and :<git-sha> for traceability
      - name: Build & Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/emart-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/emart-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/emart-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/emart-frontend:buildcache,mode=max
