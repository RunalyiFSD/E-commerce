services:
  mongodb:
    image: mongo:7.0
    container_name: emart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - emart-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: durgeshyadav63/emart-backend:latest
    container_name: emart-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
      - JWT_SECRET=emart_super_secret_jwt_key_2026_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
    networks:
      - emart-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: durgeshyadav63/emart-frontend:latest
    container_name: emart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - emart-network

networks:
  emart-network:
    driver: bridge

volumes:
  mongo-data:
